name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: C tests (${{ matrix.cc }}, ASan + UBSan)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - run: make test-c CC=${{ matrix.cc }}

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: make test-python

  fuzz:
    name: libFuzzer, receive path (60 s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make fuzz
      - run: mkdir -p build/corpus && cp firmware/fuzz_corpus/* build/corpus/
      - run: ./build/fuzz_rx -max_total_time=60 build/corpus
